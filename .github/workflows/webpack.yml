name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.760ca14937149d8be957d843d5d39463 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cfat_nBB9Cqz7Zv76jLJS6t81tgBoeMDhfEelJDvqkVhr437ff4e6 }}
